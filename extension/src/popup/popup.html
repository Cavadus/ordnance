<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ordnance</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="ordnance-header">
    <img src="../../icons/icon32.png" alt="" width="20" height="20" />
    <div>
      <div class="ordnance-title">Ordnance</div>
      <div class="ordnance-tagline">Helldivers 2 mods, one click.</div>
    </div>
  </header>

  <section id="connection" class="ordnance-card">
    <div id="connection-status" class="ordnance-status">Checking…</div>
    <div id="connection-help" class="ordnance-help" hidden>
      <a id="connection-help-link" href="#" target="_blank" rel="noopener">Get Ordnance</a>
    </div>
    <div id="connection-start" class="ordnance-help" hidden>
      <button type="button" id="start-ordnance-button">Start Ordnance</button>
    </div>
    <div id="game-status" class="ordnance-substatus" hidden></div>
  </section>

  <section class="ordnance-card">
    <h2>Auto-capture on this site</h2>
    <p class="ordnance-note">Off by default. When on, every archive download from this site installs automatically -- no button click needed.</p>
    <label class="ordnance-toggle-row">
      <span id="site-name">Not on a known mod site</span>
      <input type="checkbox" id="auto-capture-toggle" disabled />
    </label>
  </section>

  <section class="ordnance-card">
    <h2>After install</h2>
    <select id="after-install-select">
      <option value="">Use Ordnance's setting</option>
      <option value="library">Add to library</option>
      <option value="profile">Add to profile</option>
      <option value="deploy">Add &amp; deploy</option>
    </select>
  </section>

  <section class="ordnance-card">
    <h2>Recent installs</h2>
    <ul id="recent-installs" class="ordnance-list">
      <li class="ordnance-empty">No installs yet.</li>
    </ul>
  </section>

  <script src="../lib/browser-shim.js"></script>
  <script src="../lib/sources.js"></script>
  <script src="popup.js"></script>
</body>
</html>
