# Publish a GitHub release to Nexus Mods mod 18263.
#
# Runs after build.yml creates the release. It does not run on tag pushes
# itself, and it skips prereleases. Each asset is a new version of the file
# slot already on the mod page. The ids below are the v3 API ids.
# 18263 is the number in the site URL. The changelog call 404s with it.
# The release notes are posted once, with the Windows setup, because
# POST /mods/{id}/changelogs appends and a second call duplicates the note.
#
# Re-running a successful job uploads every file again and appends the note
# again. Do not re-run it to "retry" a release that already published.
#
# build.yml publishes the release with GITHUB_TOKEN, and that token does not
# start this workflow. Publish the release with a user token, or run this
# workflow by hand and pass the tag. Pass file_ids to upload only the slots
# that failed, so the Windows setup does not post the changelog a second time.
#
# Nexus rejects .deb, .rpm, .tar.gz, and .AppImage. Those are zipped first.
name: Publish to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload
        required: true
        default: v0.4.6
        type: string
      file_ids:
        description: Comma-separated Nexus file ids. Empty uploads every file.
        required: false
        default: ""
        type: string

jobs:
  nexus:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Changelog and the mod-page version ride on the primary file only.
          - file_id: "8267493"
            pattern: "Ordnance-VERSION-windows-x64-setup.exe"
            display: "Ordnance VERSION Windows X64 Setup"
            version_from: tag
            changelog: true
            update_mod_version: true
            manager_download: true
          - file_id: "8267487"
            pattern: "Ordnance-VERSION-windows-x64-portable.zip"
            display: "Ordnance VERSION Windows X64 Portable"
            version_from: tag
            changelog: false
            update_mod_version: false
            manager_download: false
          - file_id: "8267517"
            pattern: "Ordnance-VERSION-linux-amd64.deb"
            display: "Ordnance VERSION Linux Amd64.Deb"
            version_from: tag
            changelog: false
            update_mod_version: false
            manager_download: false
          - file_id: "8267520"
            pattern: "Ordnance-VERSION-linux-x64.tar.gz"
            display: "Ordnance VERSION Linux X64.Tar.Gz"
            version_from: tag
            changelog: false
            update_mod_version: false
            manager_download: false
          - file_id: "8267526"
            pattern: "Ordnance-VERSION-linux-x86_64.AppImage"
            display: "Ordnance VERSION Linux X86 64.Appimage"
            version_from: tag
            changelog: false
            update_mod_version: false
            manager_download: false
          - file_id: "8267535"
            pattern: "Ordnance-VERSION-linux-x86_64.rpm"
            display: "Ordnance VERSION Linux X86 64.Rpm"
            version_from: tag
            changelog: false
            update_mod_version: false
            manager_download: false
          - file_id: "8267496"
            pattern: "ordnance-extension-chrome-*.zip"
            display: "Ordnance Extension Chrome EXTVER"
            version_from: filename
            changelog: false
            update_mod_version: false
            manager_download: false
          - file_id: "8267502"
            pattern: "ordnance-extension-firefox-*.zip"
            display: "Ordnance Extension Firefox EXTVER"
            version_from: filename
            changelog: false
            update_mod_version: false
            manager_download: false
    steps:
      - name: Decide whether this file was requested
        id: want
        run: |
          set -euo pipefail
          want=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.file_ids }}" ]; then
            ids=",${{ inputs.file_ids }},"
            case "$ids" in
              *",${{ matrix.file_id }},"*) ;;
              *) want=false ;;
            esac
          fi
          echo "want=$want" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: rel
        if: steps.want.outputs.want == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        if: steps.want.outputs.want == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ steps.rel.outputs.tag }}" --dir dist --repo "${{ github.repository }}"

      - name: Select this file
        if: steps.want.outputs.want == 'true'
        id: asset
        run: |
          set -euo pipefail
          tag="${{ steps.rel.outputs.tag }}"
          version="${tag#v}"
          if [ "$version" = "$tag" ] || [ -z "$version" ]; then
            echo "::error::release tag '$tag' is not a vX.Y.Z tag"
            exit 1
          fi
          pattern="${{ matrix.pattern }}"
          pattern="${pattern/VERSION/$version}"
          matches=(dist/$pattern)
          if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
            echo "::error::expected one asset matching $pattern, found ${#matches[@]}"
            exit 1
          fi
          path="${matches[0]}"
          base=$(basename "$path")
          if [ "${{ matrix.version_from }}" = "filename" ]; then
            extver=$(printf '%s' "$base" | sed -n 's/^ordnance-extension-[a-z]*-\(.*\)\.zip$/\1/p')
            if [ -z "$extver" ]; then
              echo "::error::could not read an extension version from $base"
              exit 1
            fi
            file_version="$extver"
          else
            file_version="$version"
          fi
          display="${{ matrix.display }}"
          display="${display/VERSION/$version}"
          display="${display/EXTVER/$file_version}"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "version=$file_version" >> "$GITHUB_OUTPUT"
          echo "display=$display" >> "$GITHUB_OUTPUT"

      - name: Read release notes
        id: notes
        if: steps.want.outputs.want == 'true' && matrix.changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body=$(gh release view "${{ steps.rel.outputs.tag }}" --repo "${{ github.repository }}" --json body --jq .body)
          if [ -z "$body" ]; then
            echo "::error::release ${{ steps.rel.outputs.tag }} has no notes to send to Nexus"
            exit 1
          fi
          delim="NOTES_$(uuidgen | tr -d '-')"
          {
            echo "body<<$delim"
            printf '%s\n' "$body"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # Nexus accepts .rar, .zip, .7z, .exe, and .omod. A .deb or .AppImage
      # is rejected with 422, so those go up as a zip of the original file.
      - name: Zip file types Nexus will not accept
        if: steps.want.outputs.want == 'true'
        id: wrapped
        run: |
          set -euo pipefail
          path="${{ steps.asset.outputs.path }}"
          lower=$(printf '%s' "$(basename "$path")" | tr '[:upper:]' '[:lower:]')
          case "$lower" in
            *.rar|*.zip|*.7z|*.exe|*.omod)
              echo "path=$path" >> "$GITHUB_OUTPUT"
              ;;
            *)
              (cd "$(dirname "$path")" && zip -q "$(basename "$path").zip" "$(basename "$path")")
              echo "path=${path}.zip" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # v1.0.0-beta.10. Do not float @main: Nexus has already renamed these inputs once.
      - name: Upload to Nexus Mods
        if: steps.want.outputs.want == 'true'
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: "26280904902487"
          file_id: ${{ matrix.file_id }}
          filename: ${{ steps.wrapped.outputs.path }}
          display_name: ${{ steps.asset.outputs.display }}
          description: ${{ steps.asset.outputs.display }}
          version: ${{ steps.asset.outputs.version }}
          category: main
          archive_existing_version: true
          update_mod_version: ${{ matrix.update_mod_version }}
          primary_mod_manager_download: ${{ matrix.manager_download && 'true' || '' }}
          allow_mod_manager_download: ${{ matrix.manager_download && 'true' || '' }}
          changelog: ${{ matrix.changelog && steps.notes.outputs.body || '' }}
